
name: CyberShieldAI Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  java-tests:
    name: Spring Boot Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cybershield_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d cybershield_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend-java

    env:
      APP_PASSWORD: ci-test-password

      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/cybershield_test
      SPRING_DATASOURCE_USERNAME: testuser
      SPRING_DATASOURCE_PASSWORD: testpassword

      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop

      AI_ENGINE_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend-java/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run Spring Boot tests
        run: ./mvnw clean verify -B

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: backend-java/target/surefire-reports/
          if-no-files-found: ignore
