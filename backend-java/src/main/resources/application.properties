
# ==========================================
# CyberShieldAI - Main Configuration
# ==========================================

spring.application.name=CyberShieldAI
server.port=${PORT:8080}

# Supabase PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.yxrzzvdqgklnoweteliw}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Python AI Engine
ai.engine.url=${AI_ENGINE_URL:http://127.0.0.1:8000}

# File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Connection Pool
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0

# Logging
logging.level.root=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.web.client=WARN
logging.level.com.cybershield=INFO

# Error Responses
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

spring.mvc.log-request-details=false
spring.web.resources.add-mappings=false
