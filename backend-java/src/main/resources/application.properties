
# ==========================================
# CyberShield AI - Spring Boot Configuration
# ==========================================

# Application
spring.application.name=CyberShieldAI
server.port=8080

# ==========================================
# Supabase PostgreSQL Database
# ==========================================

spring.datasource.url=jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.yxrzzvdqgklnoweteliw
spring.datasource.password=${DB_PASSWORD}

# ==========================================
# Hibernate / JPA
# ==========================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ==========================================
# Python FastAPI AI Engine
# ==========================================

ai.engine.url=http://127.0.0.1:8000

# ==========================================
# File Upload Limits
# ==========================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# ==========================================
# Logging - Safe Defaults
# ==========================================

logging.level.root=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.web.client=WARN
logging.level.com.cybershield=INFO

# ==========================================
# Secure Error Responses
# ==========================================

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# ==========================================
# Disable Detailed Debug Information
# ==========================================

spring.mvc.log-request-details=false
spring.web.resources.add-mappings=false
