
# ==========================================
# CyberShield AI - Test Configuration
# ==========================================

# In-memory database
spring.datasource.url=jdbc:h2:mem:cybershield_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Local AI engine
ai.engine.url=http://127.0.0.1:8000

# Test-only internal key
AI_ENGINE_INTERNAL_KEY=local-test-key-not-for-production

# Logging
logging.level.root=WARN
